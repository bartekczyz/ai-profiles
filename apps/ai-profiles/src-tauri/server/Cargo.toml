[package]
name = "ai-profiles-server"
version = "0.0.0"
description = "Runs on a Linux machine and lets ai-profiles list its Claude accounts and sessions, and start or resume them in tmux with Remote Control."
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "ai-profiles-server"
path = "src/main.rs"

[dependencies]
ai-profiles-core = { path = "../core" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
getrandom = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
if-addrs = "0.15.0"
ipnet = { version = "2", features = ["serde"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.8"
toml_edit = "0.20"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ai-profiles-core = { path = "../core", features = ["tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
