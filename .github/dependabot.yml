version: 2
updates:
  # Workflows pin every action to a commit SHA, so a moved tag can't swap in
  # new code. This keeps those pins (and their `# vX.Y.Z` comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
