name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './apps/ai-profiles/src-tauri -> target'

      - name: cargo fmt --check
        # --all: without it only the root package is checked, not the shim.
        run: cargo fmt --all --check
        working-directory: apps/ai-profiles/src-tauri

      - name: cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/ai-profiles/src-tauri

      - name: cargo test
        # State-touching tests are serialised via the cfg(test) tempdir in
        # paths.rs, so --test-threads=1 is no longer strictly required.
        # Kept as a safety net.
        run: cargo test -- --test-threads=1
        working-directory: apps/ai-profiles/src-tauri

  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # fallow audit diffs against the PR base, so it needs history.
          fetch-depth: 0

      # No `version:` here on purpose — `packageManager` in root
      # package.json is the source of truth and pnpm/action-setup@v4
      # errors out if both are set.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Restore turbo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm turbo run typecheck

      - name: biome check
        run: pnpm biome check

      - name: test
        run: pnpm turbo run test

      - name: fallow audit (new findings in changed files)
        if: github.event_name == 'pull_request'
        run: pnpm fallow audit --base origin/${{ github.base_ref }} --quiet

      - name: fallow (full)
        if: github.event_name == 'push'
        run: pnpm fallow --quiet
