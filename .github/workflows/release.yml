name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)build, e.g. v0.1.1'
        required: true
        type: string

# tauri-action uploads the built .dmg / updater artifacts to the
# release tagged `tagName`; that's a write op on the Releases API and
# needs `contents: write`. Without it GitHub returns "Resource not
# accessible by integration" on the upload step.
permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    env:
      # Whether Apple signing is configured: a boolean, not the secret, so
      # it's safe job-wide. Picks the signed or unsigned build step below.
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      # On `workflow_dispatch` we explicitly check out the requested tag;
      # on `push: tags/v*` we just take whatever ref triggered the run.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # No `version:` here — root package.json's `packageManager` field
      # is the source of truth; pnpm/action-setup@v4 errors if both are set.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './apps/ai-profiles/src-tauri -> target'

      - name: Restore turbo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Apple secrets reach the signing step and nothing else. Exported to
      # $GITHUB_ENV they would be readable by every later step, post-job
      # hooks of third-party actions included. Tauri's bundler imports
      # APPLE_CERTIFICATE into a temporary keychain itself, so no separate
      # keychain step needs them either. An empty APPLE_CERTIFICATE still
      # counts as set and fails the import, so an unsigned build needs a
      # step without the variables at all: hence two copies of tauri-action.
      - name: Note unsigned build
        if: env.APPLE_SIGNING != 'true'
        run: echo "::notice::APPLE_CERTIFICATE not set — building unsigned. Users will see a Gatekeeper warning."

      - name: Build, sign and upload
        if: env.APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/ai-profiles
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'ai-profiles ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'See [CHANGELOG.md](./apps/ai-profiles/CHANGELOG.md) for details. Auto-update will pick this up on the next 6-hour check.'
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Build and upload (unsigned)
        if: env.APPLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/ai-profiles
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'ai-profiles ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'See [CHANGELOG.md](./apps/ai-profiles/CHANGELOG.md) for details. Auto-update will pick this up on the next 6-hour check.'
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      # release-please publishes the GitHub Release as a draft so users
      # never see a release without its .dmg attached. Flip it to
      # published only after tauri-action successfully uploaded every
      # asset — implicit `if: success()` skips this on failure, leaving
      # the broken release as a draft for inspection.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag || github.ref_name }}" --draft=false
